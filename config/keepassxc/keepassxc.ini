[General]
ConfigVersion=2
FaviconDownloadTimeout=20
OpenPreviousDatabasesOnStartup=false
OpenURLOnDoubleClick=false
RememberLastKeyFiles=false
URLDoubleClickAction=1

[Browser]
CustomProxyLocation=
Enabled=false

[GUI]
ApplicationTheme=dark
ColorPasswords=true
CompactMode=false
HidePasswords=true
HideUsernames=false
MonospaceNotes=true
ShowExpiredEntriesOnDatabaseUnlock=false
ShowExpiredEntriesOnDatabaseUnlockOffsetDays=1
TrayIconAppearance=monochrome-light

[PasswordGenerator]
AdditionalChars=$@&#
AdvancedMode=false
ExcludedChars=
Length=16
SpecialChars=false
WordCount=5

[Security]
ClearClipboardTimeout=180
ClearSearch=true
EnableCopyOnDoubleClick=false
IconDownloadFallback=true
LockDatabaseIdle=true
LockDatabaseIdleSeconds=300
PasswordEmptyPlaceholder=true
